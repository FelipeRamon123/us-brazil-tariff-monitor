name: Update data and deploy Pages

on:
  workflow_dispatch:
    inputs:
      refresh_yale:
        description: Download and extract the latest Yale release (large file)
        type: boolean
        default: true
  schedule:
    - cron: "17 12 * * 1"
    - cron: "37 10 15 * *"
  push:
    branches: [main]
    paths-ignore: ["README.md", "README.pt-BR.md", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore source-data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/census_brazil_hts10.csv.gz
            data/raw/yale_brazil_rates.csv.gz
            data/raw/yale_release.json
          key: source-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: source-data-${{ runner.os }}-

      - name: Update Census HTS10 data
        if: github.event_name != 'pull_request'
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          if [ -n "$CENSUS_API_KEY" ]; then
            python scripts/fetch_census.py
          else
            echo "CENSUS_API_KEY is not configured; using the tracked audited snapshot."
          fi

      - name: Refresh Portuguese HS nomenclature
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: python scripts/fetch_nomenclature_pt.py

      - name: Refresh Yale product-country panel
        if: github.event_name != 'pull_request' && (github.event.schedule == '37 10 15 * *' || github.event_name == 'workflow_dispatch' && inputs.refresh_yale)
        run: |
          python scripts/fetch_yale.py
          python scripts/extract_yale_brazil.py

      - name: Build and validate dashboard
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            IMPORTS="data/raw/census_brazil_hts10.csv.gz"
            if [ ! -f "$IMPORTS" ]; then IMPORTS="data/source/census_brazil_hts10_2025-01_to_2026-09.csv.gz"; fi
            python scripts/build_dashboard.py --imports "$IMPORTS"
          fi
          python scripts/validate_data.py
          python -m pytest -q

      - name: Commit refreshed public artifacts
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/audit.json data/nomenclature_pt.json data/processed/
          git diff --cached --quiet || git commit -m "data: refresh Census and Yale dashboard"
          git push

      - name: Save source-data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/raw/census_brazil_hts10.csv.gz
            data/raw/yale_brazil_rates.csv.gz
            data/raw/yale_release.json
          key: source-data-${{ runner.os }}-${{ github.run_id }}

      - name: Package reusable analytical dataset
        run: |
          test -f data/processed/us-brazil-tariff-exposure.csv.gz
          test -f data/processed/dataset-manifest.json
          cp data/processed/us-brazil-tariff-exposure.csv.gz us-brazil-tariff-exposure.csv.gz
          cp data/processed/dataset-manifest.json dataset-manifest.json

      - name: Upload dataset for review
        uses: actions/upload-artifact@v4
        with:
          name: us-brazil-tariff-exposure-${{ github.sha }}
          path: |
            us-brazil-tariff-exposure.csv.gz
            dataset-manifest.json

      - name: Publish monthly data release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERIOD=$(python -c "import json; print(json.load(open('dataset-manifest.json'))['latest_period'])")
          TAG="data-${PERIOD}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" us-brazil-tariff-exposure.csv.gz dataset-manifest.json --clobber
          else
            gh release create "$TAG" us-brazil-tariff-exposure.csv.gz dataset-manifest.json --title "Dados até ${PERIOD}" --notes "Base mensal Brasil × HTSUS10 com valores do U.S. Census e exposição tarifária adicional modelada a partir do Yale Tariff Rate Tracker. Consulte dataset-manifest.json para corte, cobertura e método."
          fi

      - uses: actions/configure-pages@v5
        if: vars.ENABLE_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        with:
          path: .

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

